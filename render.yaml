services:
  - type: web
    name: mfp-connector
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m connectors.myfitnesspal serve --transport http
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CONNECTOR_PASSWORD
        sync: false
      - key: CONNECTOR_SECRET
        sync: false
      - key: MFP_COOKIE_HEADER
        sync: false
